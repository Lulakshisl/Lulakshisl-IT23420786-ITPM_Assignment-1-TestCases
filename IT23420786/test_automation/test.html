<!DOCTYPE html>
<html>
<head><title>Test Translator</title></head>
<body>
    <textarea id="input" placeholder="Type Singlish here"></textarea><br>
    <textarea id="output" placeholder="Sinhala output will appear here" readonly></textarea><br>
    <button id="translate">Transliterate</button>
    <script>
        document.getElementById('translate').onclick = () => {
            let input = document.getElementById('input').value;
            // Dummy translation: just add "සිංහල: " prefix
            document.getElementById('output').value = "සිංහල: " + input;
        };
    </script>
</body>
</html>
